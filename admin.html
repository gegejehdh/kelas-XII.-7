        window.addEventListener('DOMContentLoaded', async () => {
            try {
                app = initializeApp(firebaseConfig);

                auth = getAuth(app);

                const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : undefined;
                if (token) {
                    await signInWithCustomToken(auth, token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    currentUser = user;
                    setupRealtimeListeners();
                });

                console.warn("Demo mode active:", e);
                renderAll();

            renderAll();

        function setupRealtimeListeners() {
            if (!db || !currentUser) return;
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings'), (snap) => {
                if (snap.exists()) appData.settings = snap.data();
                renderAll();
            });
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'teacher'), (snap) => {
                if (snap.exists()) appData.teacher = snap.data();
                renderAll();
            });

                appData.students = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderAll();
